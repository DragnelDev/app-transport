# Nginx del servidor (VPS Ubuntu) como proxy inverso hacia el contenedor "frontend" (puerto 8080).
# Instalar:  sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/transporte
#            sudo ln -s /etc/nginx/sites-available/transporte /etc/nginx/sites-enabled/
# SSL:       sudo certbot --nginx -d transporte.midominio.com
server {
  listen 80;
  server_name transporte.midominio.com;

  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }
}

# Colocar FUERA del bloque server (en /etc/nginx/conf.d/websocket.conf):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
