services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-transport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transport}
      POSTGRES_DB: ${DB_NAME:-transport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-transport}']
      interval: 5s
      retries: 10

  backend:
    build: ./backend-transport
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      PORT: 3000
    expose:
      - '3000'

  frontend:
    build: ./frontend-transport
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  pgdata:
